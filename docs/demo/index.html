<script>
const KEY = 'demo';
const MINI = new URLSearchParams(location.search).get('mini') === '1';
if (MINI) document.body.classList.add('minimode');
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const IC = {
  quests: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5l1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z"/>',
  setup: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>',
  guide: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  log: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
  settings: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  game: '<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15.5 12h.01M18 14h.01"/>',
  video: '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>',
  orb: '<circle cx="12" cy="12" r="8"/><path d="M8.5 10a4 4 0 0 1 3.5-2.5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  sort: '<path d="M3 6h13M3 12h9M3 18h5M17 8v12M14 17l3 3 3-3"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  timer: '<path d="M6 2h12M6 22h12M7 2v4l5 6-5 6v4M17 2v4l-5 6 5 6v4"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  eyeoff: '<path d="M17.9 17.9A10 10 0 0 1 12 20C5 20 2 12 2 12a18 18 0 0 1 4.1-5.9M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.3M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/>',
  cards: '<rect x="3" y="3" width="8" height="12" rx="2"/><rect x="13" y="3" width="8" height="12" rx="2"/><path d="M3 19h8M13 19h8"/>',
  list: '<rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="3" y="10" width="18" height="4" rx="1.5"/><rect x="3" y="16" width="18" height="4" rx="1.5"/>',
  window: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><rect x="12" y="12" width="6" height="5" rx="1"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',
  play: '<path d="M7 4l13 8-13 8z"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M12 8C10 4 6 4 6 6.5S10 8 12 8zM12 8c2-4 6-4 6-1.5S14 8 12 8z"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  plug: '<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'
};
const icon = (n, cls) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'i' + (cls ? ' ' + cls : '')); s.innerHTML = IC[n] || ''; return s; };
document.querySelectorAll('i[data-ic]').forEach((n) => n.replaceWith(icon(n.dataset.ic)));
const TASKIC = { WATCH_VIDEO: 'video', WATCH_VIDEO_ON_MOBILE: 'video', PLAY_ON_DESKTOP: 'game', STREAM_ON_DESKTOP: 'game', PLAY_ACTIVITY: 'activity' };
const withIc = (n, text, cls) => { const b = el('span', cls); b.append(icon(n), text); return b; };
let DICT = {}, LANG = '', LOC = 'pl-PL';
const LOCS = { pl: 'pl-PL', en: 'en-GB', de: 'de-DE', fr: 'fr-FR', es: 'es-ES', it: 'it-IT', pt_BR: 'pt-BR', ru: 'ru-RU', uk: 'uk-UA', tr: 'tr-TR', ja: 'ja-JP', zh_CN: 'zh-CN' };
const t = (k, v) => { let s = DICT[k] ?? k; if (v) for (const [a, b] of Object.entries(v)) s = s.split('{' + a + '}').join(b); return s; };
const api = (path, body) => fetch(path, body ? { method: 'POST', headers: { 'X-Orbek-Key': KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { headers: { 'X-Orbek-Key': KEY } }).then((r) => r.json());
const op = (o) => api('/api/op', o).then((r) => { setTimeout(tick, 250); return r; });

// a dialog of our own (the browser's confirm() would say "127.0.0.1 says…")
function ask(title, text, okLabel, warn) {
  return new Promise((done) => {
    const d = el('div', 'dlg'), box = el('div', 'box' + (warn ? ' warn' : '')), h = el('h3');
    if (warn) h.append(el('span', 'ic', '!'));
    h.append(title); box.append(h, el('p', '', text));
    const acts = el('div', 'acts'), no = el('button', 'btn', t('dlg.cancel')), yes = el('button', 'btn ' + (warn ? 'bad' : 'pri'), okLabel);
    const close = (v) => { d.remove(); document.removeEventListener('keydown', key); done(v); };
    const key = (e) => { if (e.key === 'Escape') close(false); };
    no.onclick = () => close(false); yes.onclick = () => close(true); d.onclick = (e) => { if (e.target === d) close(false); };
    document.addEventListener('keydown', key);
    acts.append(no, yes); box.append(acts); d.append(box); document.body.append(d); yes.focus();
  });
}

async function loadLang(code) {
  if (code === LANG) return;
  LANG = code; LOC = LOCS[code] || 'en-GB';
  DICT = await fetch('lang/' + code + '.json', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({}));
  document.documentElement.lang = code.replace('_', '-');
  document.querySelectorAll('[data-i]').forEach((n) => (n.textContent = t(n.dataset.i)));
  document.querySelectorAll('[data-ph]').forEach((n) => (n.placeholder = t(n.dataset.ph)));
  render(true);
}

document.querySelectorAll('nav button').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
  document.querySelectorAll('.page').forEach((p) => p.classList.toggle('on', p.id === 'p-' + b.dataset.p));
}));

let saved = {}; try { saved = JSON.parse(localStorage.getItem('orbek.ui') || '{}'); } catch {}
const ui = Object.assign({ tab: 'all', sort: 'ending', cos: false, hide: true, q: '', view: 'cards' }, saved, { q: '' });
if (MINI) ui.view = 'mini';
const keep = () => { try { localStorage.setItem('orbek.ui', JSON.stringify({ tab: ui.tab, sort: ui.sort, cos: ui.cos, hide: ui.hide, view: MINI ? saved.view : ui.view })); } catch {} };
let S = null, lastSig = '';
const now = () => Date.now();
const open = (q) => !q.completedAt && !(q.expiresAt && q.expiresAt <= now()) && !(q.startsAt && q.startsAt > now());
const KIND = { WATCH_VIDEO: 'video', WATCH_VIDEO_ON_MOBILE: 'video', PLAY_ON_DESKTOP: 'game', STREAM_ON_DESKTOP: 'game', PLAY_ACTIVITY: 'game' };
const kind = (q) => KIND[q.task] || 'other';
const mins = (s) => { if (s > 0 && s < 60) return t('dur.s', { s: Math.round(s) }); const m = Math.floor(s / 60); return m >= 60 ? t('dur.hm', { h: Math.floor(m / 60), m: m % 60 }) : t('dur.m', { m }); };
const left = (ms) => { const d = ms - now(); if (d <= 0) return t('time.over'); const h = Math.floor(d / 36e5); return h >= 48 ? t('time.days', { n: Math.floor(h / 24) }) : h >= 1 ? t('time.hours', { n: h }) : t('time.mins', { n: Math.max(1, Math.floor(d / 6e4)) }); };
const fmtNum = (n) => Number(n).toLocaleString(LOC);
const runOf = (q) => (S.runs || []).find((r) => r.id === q.id);
// Discord reports game minutes about once a minute: between reports the panel counts on by itself
function progressOf(q) {
  const r = runOf(q);
  if (q.completedAt) return q.target;
  if (!r) return q.progress;
  let p = Math.max(q.progress, r.progress || 0);
  if (kind(q) === 'game' && r.progressAt && now() - r.progressAt < 120000) p += (now() - r.progressAt) / 1000;
  return Math.min(q.target, p);
}
const pct = (q) => (q.target ? Math.min(100, Math.floor(progressOf(q) / q.target * 100)) : q.completedAt ? 100 : 0);
// Discord's own Orb picture, from the quests that give Orbs
const orbImg = () => { for (const q of S.quests) for (const r of q.rewards || []) if (r.type === 4 && r.img) return r.img; return ''; };

function ring(q, size) {
  const v = pct(q), live = !!runOf(q), R = 18, C = 2 * Math.PI * R;
  const w = el('div', 'ring' + (q.completedAt ? ' ok' : '') + (live ? ' live' : ''));
  if (size) { w.style.width = w.style.height = size + 'px'; }
  w.innerHTML = `<svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="${R}"/><circle class="fg" cx="22" cy="22" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - v / 100)}"/></svg>`;
  w.append(el('b', '', v + '%'));
  return w;
}

function status(q) {
  if (q.claimedAt) return ['ok', t('st.claimed')];
  if (q.completedAt) return ['warn', t('st.toClaim')];
  if (q.expiresAt && q.expiresAt <= now()) return ['', t('st.over')];
  if (q.startsAt && q.startsAt > now()) return ['', t('st.soon')];
  if (runOf(q)) return ['run', t('st.running')];
  const qi = S.queue.indexOf(q.id); if (qi >= 0) return ['', t('st.queued', { n: qi + 1 })];
  if (q.enrolledAt) return ['', t('st.enrolled')];
  return ['', t('st.available')];
}

function rewardImg(r) {
  const im = el('div', 'im'), src = r.img || (r.type === 4 ? orbImg() : '');
  const fallback = () => { im.textContent = ''; if (r.type === 4) im.append(el('span', 'orbdot big')); else im.append(icon(r.type === 3 ? 'spark' : r.type === 2 ? 'game' : 'gift', 'rwi t' + r.type)); };
  if (src) {
    const media = /\.(mp4|webm)(\?|$)/i.test(src) ? Object.assign(el('video'), { autoplay: true, muted: true, loop: true, playsInline: true }) : el('img');
    media.src = src; media.onerror = fallback; im.append(media);
  } else fallback();
  return im;
}
const rewardName = (r) => (r.type === 4 && r.orbs ? t('r.orbsN', { n: fmtNum(r.orbs) }) : r.name || t('r.t' + r.type));

function rewardEl(r) {
  const row = el('div', 'rw'), txt = el('div'); txt.style.minWidth = '0';
  txt.append(el('div', 'rn', rewardName(r)), withIc({ 4: 'orb', 3: 'spark', 2: 'game', 1: 'gift', 5: 'gift' }[r.type] || 'gift', t('r.t' + r.type), 'rk t' + r.type));
  row.append(rewardImg(r), txt);
  return row;
}

function actions(q) {
  const acts = el('div', 'acts'), live = !!runOf(q), queued = S.queue.includes(q.id);
  const btn = (cls, label, fn, ic) => { const x = el('button', 'btn sm ' + cls); if (ic) x.append(icon(ic)); x.append(label); x.onclick = (e) => { e.stopPropagation(); fn(); }; acts.append(x); return x; };
  if (!S.connected) return acts;
  if (q.completedAt && !q.claimedAt) btn('ok', t('q.claim'), () => op({ op: 'claim', id: q.id }), 'gift');
  else if (open(q)) {
    if (!q.enrolledAt) btn('', t('q.enroll'), () => op({ op: 'enroll', id: q.id }), 'plus');
    if (live || queued) btn('bad', t('q.stop'), () => op({ op: 'stop', id: q.id }), 'stop');
    else if (S.settings.autoMode && q.auto) {
      const x = btn('pri', t('q.run'), () => op({ op: 'run', ids: [q.id] }), 'play');
      if ((q.task === 'PLAY_ON_DESKTOP' || q.task === 'STREAM_ON_DESKTOP') && !S.desktop) { x.disabled = true; x.title = t('q.needApp'); }
      if (q.task === 'STREAM_ON_DESKTOP') x.title = t('run.streamHint');
    }
  }
  return acts;
}

function card(q, i) {
  const [stc, stl] = status(q), r = runOf(q);
  const c = el('div', 'q' + (r ? ' live' : '') + (q.claimedAt || (q.expiresAt && q.expiresAt <= now()) ? ' dim' : ''));
  c.style.animationDelay = Math.min(i, 12) * 25 + 'ms';
  const hero = el('div', 'hero');
  if (q.hero && !/\.(mp4|webm)/i.test(q.hero)) hero.style.backgroundImage = `url("${q.hero}")`;
  const tags = el('div', 'tags'); tags.append(withIc(TASKIC[q.task] || 'quests', DICT['task.' + q.task] || q.task, 'pill ' + kind(q)));
  if (q.cosmetic) tags.append(withIc('spark', t('r.t3'), 'pill cos'));
  tags.append(el('span', 'pill st ' + stc, stl));
  hero.append(tags);
  const b = el('div', 'qb');
  b.append(el('div', 'qt', q.name));
  const meta = el('div', 'qm'); meta.append([q.game, q.publisher].filter(Boolean).join(' · '));
  if (q.expiresAt) { meta.append(el('span', '', '·'), icon('clock'), left(q.expiresAt)); }
  b.append(meta);
  if (q.target > 0) {
    const p = progressOf(q), row = el('div', 'pr'), g = el('div', 'grow');
    const tr = el('div', 'track' + (q.completedAt ? ' ok' : '')), f = el('div'); f.style.width = pct(q) + '%'; tr.append(f);
    g.append(tr, el('div', 'qm', t('q.prog', { a: mins(Math.min(p, q.target)), b: mins(q.target) })));
    row.append(g, ring(q)); b.append(row);
    if (r && r.note) { const n = el('div', 'note'); n.append(icon('alert'), t(r.note)); b.append(n); }
  }
  for (const rw of q.rewards || []) b.append(rewardEl(rw));
  const acts = actions(q); if (acts.childNodes.length) b.append(acts);
  c.append(hero, b);
  return c;
}

// mini view: just the reward and a ring, all side by side
function tile(q, i) {
  const r0 = (q.rewards || [])[0] || { type: 0, name: q.name };
  const c = el('div', 'mt' + (runOf(q) ? ' live' : '') + (q.completedAt ? ' done' : ''));
  c.style.animationDelay = Math.min(i, 20) * 15 + 'ms';
  c.title = q.name + ((q.rewards || []).length > 1 ? '\n' + q.rewards.map(rewardName).join(' + ') : '');
  const tx = el('div', 'tx'); tx.append(el('div', 'rn', rewardName(r0) + ((q.rewards || []).length > 1 ? ' +' + (q.rewards.length - 1) : '')), el('div', 'qn', q.game || q.name));
  c.append(rewardImg(r0), tx, ring(q, 40));
  return c;
}

function shown() {
  const s = ui.q.trim().toLowerCase();
  const rank = (q) => (q.completedAt && !q.claimedAt ? -1 : q.claimedAt ? 2 : 0);
  return S.quests
    .filter((q) => MINI || ui.tab === 'all' || (ui.tab === 'orbs' ? q.orbs > 0 : kind(q) === (ui.tab === 'games' ? 'game' : 'video')))
    .filter((q) => MINI || !ui.cos || q.cosmetic)
    .filter((q) => !(MINI || ui.hide) || (!q.claimedAt && !(q.expiresAt && q.expiresAt <= now())))
    .filter((q) => MINI || !s || [q.name, q.game, q.publisher, ...(q.rewards || []).map((r) => r.name)].join(' ').toLowerCase().includes(s))
    .sort((a, b) => rank(a) - rank(b) || (!!runOf(b) - !!runOf(a)) || (ui.sort === 'orbs' ? b.orbs - a.orbs : ui.sort === 'short' ? (a.target - a.progress) - (b.target - b.progress) : ui.sort === 'new' ? (b.startsAt || 0) - (a.startsAt || 0) : (a.expiresAt || 9e15) - (b.expiresAt || 9e15)));
}

const SORTS = [['ending', 'clock'], ['orbs', 'orb'], ['short', 'timer'], ['new', 'spark']];
function controls() {
  const live = S.quests.filter((q) => !q.claimedAt && !(q.expiresAt && q.expiresAt <= now()));
  const tabs = $('tabs'); tabs.textContent = '';
  for (const [v, k, ic, f] of [['all', 'tab.all', 'grid', () => true], ['games', 'tab.games', 'game', (q) => kind(q) === 'game'], ['videos', 'tab.videos', 'video', (q) => kind(q) === 'video'], ['orbs', 'tab.orbs', 'orb', (q) => q.orbs > 0]]) {
    const b = el('button', ui.tab === v ? 'on' : ''); b.append(icon(ic), t(k), el('span', 'n', live.filter(f).length));
    b.onclick = () => { ui.tab = v; keep(); render(true); }; tabs.append(b);
  }
  const cur = SORTS.find((s) => s[0] === ui.sort) || SORTS[0];
  const sb = $('sortBtn'); sb.textContent = ''; sb.append(icon('sort'), t('sort.by') + ' ', el('b', '', t('sort.' + cur[0])), icon('chev', 'chev'));
  const menu = $('sortMenu'); menu.textContent = '';
  for (const [v, ic] of SORTS) { const b = el('button', ui.sort === v ? 'on' : ''); b.append(icon(ic), t('sort.' + v)); b.onclick = () => { ui.sort = v; keep(); $('sortDD').classList.remove('open'); render(true); }; menu.append(b); }
  $('fCos').classList.toggle('on', ui.cos); $('fHide').classList.toggle('on', ui.hide);
  $('vCards').classList.toggle('on', ui.view === 'cards'); $('vMini').classList.toggle('on', ui.view === 'mini');
}
$('sortBtn').onclick = (e) => { e.stopPropagation(); $('sortDD').classList.toggle('open'); };
document.addEventListener('click', () => $('sortDD').classList.remove('open'));
$('fCos').onclick = () => { ui.cos = !ui.cos; keep(); render(true); };
$('fHide').onclick = () => { ui.hide = !ui.hide; keep(); render(true); };

const vnum = (v) => (v || '0').split('.').map(Number).reduce((a, n) => a * 1000 + n, 0);

function render(force) {
  if (!S || !LANG) return;
  const list = shown();
  const img = orbImg(), orbIcon = () => { if (!img) return el('span', 'orbdot'); const i = el('img', 'orbimg'); i.src = img; i.alt = ''; i.onerror = () => i.replaceWith(el('span', 'orbdot')); return i; };
  $('orbsHave').textContent = ''; $('orbsHave').append(orbIcon(), S.orbs == null ? '–' : fmtNum(S.orbs));
  $('orbsGet').textContent = ''; $('orbsGet').append(orbIcon(), fmtNum(S.quests.filter(open).reduce((n, q) => n + q.orbs, 0)));
  const openN = S.quests.filter(open).length; $('navCnt').hidden = !openN; $('navCnt').textContent = openN;
  $('conn').className = 'conn ' + (S.connected ? 'ok' : 'off'); $('conn').textContent = S.connected ? t('conn.ok') : t('conn.off');
  $('who').hidden = !(S.connected && S.user);
  if (S.user) { $('whoName').textContent = S.user.name; $('whoImg').src = S.user.avatar || 'icon.svg'; }
  $('setupCard').hidden = S.connected; $('navSetup').hidden = S.connected;
  const old = S.connected && S.plugin && vnum(S.plugin) < vnum(S.pluginLatest);
  $('plugBanner').hidden = !old; if (old) $('plugText').textContent = t('plug.old', { a: S.plugin, b: S.pluginLatest });
  const runs = S.runs || [];
  const runnable = list.filter((q) => open(q) && q.auto && !runOf(q) && !S.queue.includes(q.id) && !((q.task === 'PLAY_ON_DESKTOP' || q.task === 'STREAM_ON_DESKTOP') && !S.desktop));
  $('autobar').hidden = !(S.settings.autoMode && S.connected);
  $('autoDot').className = 'pulse' + (runs.length ? '' : ' idle');
  if (runs.length) { $('autoText').textContent = ''; $('autoText').append(t('auto.running') + ' ', el('b', '', runs.map((r) => (S.quests.find((x) => x.id === r.id) || {}).name || '…').join(', ')), S.queue.length ? ' · ' + t('auto.queue', { n: S.queue.length }) : ''); }
  else $('autoText').textContent = t('auto.idle');
  $('runShown').textContent = ''; $('runShown').append(icon('play'), t('q.runShown', { n: runnable.length })); $('runShown').disabled = !runnable.length;
  $('runShown').onclick = () => op({ op: 'run', ids: runnable.map((q) => q.id) });
  $('stopAll').hidden = !(runs.length || S.queue.length);
  const live = runs.length > 0;
  // progress of running quests is updated in place (updateLive); only real changes redraw the list
  const sig = JSON.stringify([list.map((q) => [q.id, runOf(q) ? 0 : Math.floor(q.progress / 30), q.enrolledAt, q.completedAt, q.claimedAt]), runs.map((r) => r.id + r.note), S.queue, S.connected, S.settings.autoMode, S.desktop, ui, LANG, img]);
  if (!force && sig === lastSig) { if (live) updateLive(); return; }
  const animate = force || !lastSig;
  lastSig = sig;
  document.body.classList.toggle('still', !animate);
  if (!MINI) controls();
  const box = $('list'); box.textContent = '';
  if (!list.length) {
    box.append(el('div', 'empty', !S.connected ? t('empty.noDiscord') : !S.loaded ? t('empty.loading') : S.quests.length ? t('empty.filter') : t('empty.none')));
  } else if (ui.view === 'mini') {
    const g = el('div', 'mini'); list.forEach((q, i) => { const x = tile(q, i); x.dataset.id = q.id; g.append(x); }); box.append(g);
  } else {
    const g = el('div', 'grid'); list.forEach((q, i) => { const x = card(q, i); x.dataset.id = q.id; g.append(x); }); box.append(g);
  }
}

// between reports only the running quests' numbers move: update them in place, without redrawing
function updateLive() {
  for (const r of S.runs || []) {
    const q = S.quests.find((x) => x.id === r.id), n = document.querySelector(`[data-id="${r.id}"]`);
    if (!q || !n) continue;
    const v = pct(q), rg = n.querySelector('.ring');
    if (rg) { const fg = rg.querySelector('.fg'), C = 2 * Math.PI * 18; fg.setAttribute('stroke-dashoffset', C * (1 - v / 100)); rg.querySelector('b').textContent = v + '%'; }
    const f = n.querySelector('.track div'); if (f) f.style.width = v + '%';
    const m = n.querySelector('.pr .qm'); if (m) m.textContent = t('q.prog', { a: mins(Math.min(progressOf(q), q.target)), b: mins(q.target) });
  }
}

function renderLog() {
  const box = $('log'), lines = S.log || [];
  const sig = lines.length + ':' + (lines.length ? lines[lines.length - 1].t : 0) + LANG;
  if (box.dataset.sig === sig) return; box.dataset.sig = sig; box.textContent = '';
  for (const l of lines.slice().reverse()) { const d = el('div', l.l); d.append(el('span', 't', new Date(l.t).toLocaleString(LOC))); d.append(l.m); box.append(d); }
  if (!lines.length) box.append(el('div', '', t('log.empty')));
}

const STEPS = { node: 'inst.s.node', vencord: 'inst.s.vencord', plugin: 'inst.s.plugin', build: 'inst.s.build', inject: 'inst.s.inject', enable: 'inst.s.enable' };
function renderSetup() {
  const st = S.setup || {}, steps = st.steps && st.steps.length ? st.steps : Object.keys(STEPS).map((k) => ({ key: k, state: 'wait' }));
  $('instState').textContent = st.running ? t('inst.running') : st.done ? t('inst.done') : st.err ? t('inst.failed', { e: st.err }) : S.connected ? t('inst.connected', { v: S.plugin || '?' }) : t('inst.intro');
  $('instAll').disabled = $('instPlug').disabled = !!st.running;
  $('instPlug').hidden = !S.vencord;
  const box = $('instSteps'), sig = JSON.stringify(steps) + LANG;
  if (box.dataset.sig !== sig) {
    box.dataset.sig = sig; box.textContent = '';
    steps.forEach((s, i) => {
      const c = el('div', 'stp ' + s.state), ic = el('div', 'ic');
      if (s.state === 'run') ic.append(el('div', 'spin')); else if (s.state === 'ok') ic.append(icon('check')); else if (s.state === 'fail') ic.append(icon('x')); else ic.textContent = i + 1;
      const tx = el('div'); tx.append(el('b', '', t(STEPS[s.key])), el('span', '', t(STEPS[s.key] + 'H'))); c.append(ic, tx); box.append(c);
    });
  }
  const lines = st.lines || []; $('instLog').hidden = !lines.length;
  if ($('instLog').dataset.n !== String(lines.length) + (lines[lines.length - 1] || '')) { $('instLog').dataset.n = String(lines.length) + (lines[lines.length - 1] || ''); $('instLog').textContent = lines.join('\n'); $('instLog').scrollTop = 1e9; }
}
function renderGuide() {
  const box = $('guide'); if (box.dataset.lang === LANG) return; box.dataset.lang = LANG; box.textContent = '';
  for (let i = 1; i <= 8; i++) {
    const g = el('div', 'gi' + (i === 6 ? ' warn' : '')), h = el('h3');
    h.append(el('span', 'num', i), t('guide.' + i + 't')); g.append(h, el('p', '', t('guide.' + i))); box.append(g);
  }
}

function renderSettings() {
  document.querySelectorAll('[data-set]').forEach((n) => {
    if (document.activeElement === n) return;
    const v = S.settings[n.dataset.set];
    if (n.type === 'checkbox') n.checked = !!v; else n.value = v ?? '';
  });
  for (const k of ['autoAll', 'autoOnly', 'parallel']) document.querySelector(`[data-set=${k}]`).disabled = !S.settings.autoMode;
  $('about').textContent = 'Orbek ' + S.version + (S.plugin ? ' · plugin ' + S.plugin : '');
  $('plugInfo').textContent = (S.plugin ? t('plug.have', { v: S.plugin }) : t('plug.none')) + ' · ' + t('plug.latest', { v: S.pluginLatest }) + ' · ' + (S.vencord ? t('plug.where', { p: S.vencord }) : t('plug.noVencord'));

  const u = S.update || {};
  $('updInfo').textContent = u.state === 'available' ? t('upd.avail', { v: u.latest }) : u.state === 'downloading' ? t('upd.downloading', { v: u.latest }) : u.state === 'checking' ? t('upd.checking') : u.state === 'failed' ? t('upd.failed') : u.state === 'current' ? t('upd.current') : t('upd.never');
  if (u.doneAt && now() - u.doneAt < 600000) $('updInfo').textContent = t('upd.done', { v: S.version });
  $('updInstall').hidden = u.state !== 'available';
}
document.querySelectorAll('[data-set]').forEach((n) => (n.onchange = async () => {
  let v = n.type === 'checkbox' ? n.checked : n.value;
  if (n.dataset.set === 'parallel') v = +v;
  if (n.dataset.set === 'autoMode' && v && !(await ask(t('set.autoMode'), t('set.autoModeConfirm'), t('dlg.turnOn'), true))) { n.checked = false; return; }
  op({ op: 'settings', patch: { [n.dataset.set]: v } });
}));

$('search').oninput = (e) => { ui.q = e.target.value; render(true); };
$('refresh').onclick = () => op({ op: 'refresh' });
$('stopAll').onclick = () => op({ op: 'stopAll' });
$('clearLog').onclick = () => op({ op: 'clearLog' });
$('vCards').onclick = () => { ui.view = 'cards'; keep(); render(true); };
$('vMini').onclick = () => { ui.view = 'mini'; keep(); render(true); };
$('miniWin').onclick = () => op({ op: 'mini' });
const goPage = (p) => document.querySelector(`nav button[data-p=${p}]`).click();
const installPlugin = async () => { if (await ask(t('plug.title'), t('plug.confirm'), t('plug.install'))) { goPage('setup'); op({ op: 'pluginInstall' }); } };
$('plugBtn').onclick = installPlugin; $('plugBtn2').onclick = installPlugin; $('instPlug').onclick = installPlugin;
$('goSetup').onclick = () => goPage('setup');
$('instAll').onclick = async () => { if (await ask(t('inst.all'), t('inst.confirm'), t('inst.go'))) op({ op: 'setup' }); };
$('updCheck').onclick = () => op({ op: 'updCheck' });
$('updInstall').onclick = () => op({ op: 'updInstall' });
$('quit').onclick = async () => { if (await ask(t('set.quit'), t('set.quitConfirm'), t('set.quit'), true)) op({ op: 'quit' }).then(() => window.close()); };

const gen = +(new URLSearchParams(location.search).get('g') || 0);
let busy = false;
async function tick() {
  if (busy) return; busy = true;
  try {
    S = await api('/api/state');
    if (gen && S.winGen > gen) { window.close(); return; } // a newer panel window took over
    await loadLang(S.lang || 'en');
    render(); if (!MINI) { renderLog(); renderSettings(); renderSetup(); renderGuide(); }
  } catch (e) { $('conn').className = 'conn off'; }
  busy = false;
}
tick(); setInterval(tick, 1000);
setInterval(() => { if (S && (S.runs || []).length) updateLive(); }, 250);
</script>
</body>
</html>
