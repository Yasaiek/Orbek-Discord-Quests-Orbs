<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbek</title>
<link rel="icon" href="icon.svg">
<style>
:root {
  --bg: #0a0b13; --side: rgba(16,17,30,.82); --card: #131525; --card2: #191c30; --card3: #20233a;
  --line: rgba(255,255,255,.065); --line2: rgba(255,255,255,.11);
  --text: #eef0fb; --sub: #a3a7c2; --dim: #6c7090;
  --a1: #5865f2; --a2: #a35bff; --grad: linear-gradient(135deg, #5865f2, #a35bff);
  --orb: #b38cff; --cos: #ff6fb5; --game: #4fa3ff; --video: #ffb03a; --ok: #43d17c; --warn: #f0b232; --bad: #f25b5b;
  --ease: cubic-bezier(.2,.8,.2,1); --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
body { display: flex; overflow: hidden; background: radial-gradient(900px 500px at 15% -10%, rgba(88,101,242,.16), transparent 60%), radial-gradient(700px 500px at 105% 110%, rgba(163,91,255,.12), transparent 60%), var(--bg); }
button { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #262a44; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

aside { width: 224px; flex-shrink: 0; background: var(--side); backdrop-filter: blur(18px); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 20px; font: 700 20px var(--display); letter-spacing: -.01em; }
.brand img { width: 36px; height: 36px; filter: drop-shadow(0 4px 14px rgba(163,91,255,.5)); }
.brand small { display: block; font: 500 11px var(--display); color: var(--dim); letter-spacing: .02em; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 12px; border: 0; border-radius: 9px; background: none; color: var(--sub); cursor: pointer; text-align: left; position: relative; transition: background .15s, color .15s; }
nav button:hover { background: rgba(255,255,255,.04); color: var(--text); }
nav button.on { background: linear-gradient(90deg, rgba(88,101,242,.22), rgba(163,91,255,.08)); color: var(--text); }
nav button.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--grad); }
nav .cnt { margin-left: auto; font-size: 11px; background: rgba(88,101,242,.3); color: #dfe2ff; padding: 1px 7px; border-radius: 9px; }
nav .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--sub); display: flex; flex-direction: column; gap: 8px; }
.conn { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 10px; font-weight: 600; width: fit-content; }
.conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.conn.ok { color: var(--ok); background: rgba(67,209,124,.1); } .conn.off { color: var(--warn); background: rgba(240,178,50,.1); }
.who { display: flex; align-items: center; gap: 8px; } .who img { width: 24px; height: 24px; border-radius: 50%; }

main { flex: 1; overflow-y: auto; padding: 26px 30px 44px; }
.page { display: none; animation: fade .28s var(--ease); max-width: 1500px; } .page.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
h1 { font: 650 27px var(--display); margin: 0 0 4px; letter-spacing: -.015em; }
h2 { font: 650 17px var(--display); margin: 22px 0 10px; }
.lead { color: var(--sub); margin: 0 0 20px; }
.head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.head .grow { flex: 1; min-width: 260px; }
.orbs { display: flex; gap: 10px; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 4px 0 18px; }
/* narrower window: the three Orb cards in one row, CPU and RAM below them (never one lonely card in a row) */
@media (max-width: 1240px) { .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); } .kpis > * { grid-column: span 2; } .kpis > :nth-child(n+4) { grid-column: span 3; } }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis > *, .kpis > :nth-child(n+4) { grid-column: span 1; } .kpis > :first-child { grid-column: span 2; } }
.kpi { min-width: 0; }
.kpi > b { flex-wrap: wrap; }
.kpi .mm { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; min-width: 0; }
.spkw { position: relative; height: 40px; }
.spkw .spk { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.spkw .spkdot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--m2), 0 0 10px var(--m2); transition: top .6s ease; }
.kpi .mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 11.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kpi .mc { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 7px; background: rgba(255,255,255,.06); white-space: nowrap; }
.kpi .mc i { font-style: normal; font-size: 8px; color: var(--m2); }
.kpi .mc strong { color: var(--text); font-weight: 650; }
.kpi .mper { margin-left: auto; font-size: 11px; color: var(--dim); white-space: nowrap; }
.kpi.k-use { --m1: #ffcc4d; --m2: #ff8a3d; }
.kpi.k-ram { --m1: #29d3b4; --m2: #3a8bff; border-color: rgba(41,211,180,.26); background: linear-gradient(160deg, rgba(41,211,180,.12), rgba(41,211,180,.02)); } .kpi.k-ram::after { background: radial-gradient(circle, rgba(41,211,180,.22), transparent 70%); } .kpi.k-ram .kh { color: #8ff0dc; } .kpi.k-ram > b { color: #dcfff7; }
.kpi { position: relative; overflow: hidden; border-radius: 16px; padding: 14px 16px 13px; border: 1px solid rgba(163,91,255,.22); background: linear-gradient(160deg, rgba(88,101,242,.16), rgba(163,91,255,.05)); }
.kpi::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(163,91,255,.28), transparent 70%); pointer-events: none; }
.kpi .kh { overflow-wrap: anywhere; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--sub); text-transform: uppercase; }
.kpi .kh svg.i { width: 15px; height: 15px; }
.kpi > b { display: flex; align-items: center; gap: 9px; margin: 6px 0 6px; font: 700 26px var(--display); color: #efe8ff; font-variant-numeric: tabular-nums; }
.kpi > b .orbimg { width: 28px; height: 28px; border-radius: 8px; } .kpi > b .orbdot, .kpi > b .orbg { width: 24px; height: 24px; }
.kpi > b small { font: 600 12px var(--sans, inherit); color: var(--sub); align-self: flex-end; margin-bottom: 5px; }
.kpi .ks { display: flex; flex-wrap: wrap; gap: 5px 6px; font-size: 12px; color: var(--sub); min-height: 22px; }
.kpi .kb { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: 8px; background: rgba(255,255,255,.06); color: var(--text); }
.kpi .kb b { font-weight: 700; } .kpi .kb svg.i { width: 13px; height: 13px; }
.kpi .kb.k-cosmetic svg { color: #ff8fd0; } .kpi .kb.k-ingame svg { color: #7cc4ff; } .kpi .kb.k-code svg { color: #f0b232; }
.kpi .kq { align-self: center; color: var(--dim); }
.kpi .kr { display: block; width: 100%; font-variant-numeric: tabular-nums; }
.kpi.k-claim { border-color: rgba(62,207,142,.3); background: linear-gradient(160deg, rgba(62,207,142,.14), rgba(62,207,142,.03)); } .kpi.k-claim::after { background: radial-gradient(circle, rgba(62,207,142,.25), transparent 70%); } .kpi.k-claim .kh { color: #8fe6bd; }
.kpi.k-open { border-color: rgba(88,160,242,.28); background: linear-gradient(160deg, rgba(88,160,242,.14), rgba(88,160,242,.03)); } .kpi.k-open::after { background: radial-gradient(circle, rgba(88,160,242,.25), transparent 70%); } .kpi.k-open .kh { color: #9cc8ff; }
.kpi.k-use { border-color: rgba(240,178,50,.26); background: linear-gradient(160deg, rgba(240,178,50,.12), rgba(240,178,50,.02)); } .kpi.k-use::after { background: radial-gradient(circle, rgba(240,178,50,.2), transparent 70%); } .kpi.k-use .kh { color: #ffd98a; } .kpi.k-use > b { color: #fff1d1; }
body.minimode .kpis, body.minimode .claimbar { display: none !important; }
.stat { background: linear-gradient(160deg, rgba(88,101,242,.14), rgba(163,91,255,.06)); border: 1px solid rgba(163,91,255,.22); border-radius: 14px; padding: 10px 16px; min-width: 140px; }
.stat b { display: flex; align-items: center; gap: 7px; font: 700 21px var(--display); color: #e7dcff; }
.stat span { font-size: 12px; color: var(--sub); }
.stat.use { background: linear-gradient(160deg, rgba(62,207,142,.1), rgba(62,207,142,.03)); border-color: rgba(62,207,142,.22); min-width: 120px; } .stat.use b { color: #c9f5e2; } .stat.use b small { font: 600 11px var(--sans, inherit); color: var(--sub); } .stat.use b span { font: inherit; color: inherit; }
body.minimode .stat.use { display: none; }
.orbimg { width: 20px; height: 20px; border-radius: 50%; object-fit: contain; }
img.i { width: 18px; height: 18px; flex-shrink: 0; }
img.i.orbpic { object-fit: contain; filter: drop-shadow(0 0 4px rgba(140,110,255,.55)); }
.im.orbs { background: radial-gradient(circle at 50% 45%, rgba(120,90,255,.35), rgba(13,14,26,1) 70%) !important; }
.rw .im img.orbpic, .mt .im img.orbpic { object-fit: contain; padding: 5px; filter: drop-shadow(0 0 6px rgba(140,110,255,.6)); }
.kpi > b .orbimg { border-radius: 0 !important; filter: drop-shadow(0 0 8px rgba(140,110,255,.6)); }
.orbimg { border-radius: 0; }
.orbg { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex-shrink: 0; background: radial-gradient(circle at 35% 30%, #8f7bff, #5865f2 55%, #3b2a9e); box-shadow: 0 0 10px rgba(120,100,255,.5); } .orbg img { width: 62%; height: 62%; } .orbg.big { width: 30px; height: 30px; }
.orbdot.big { width: 26px; height: 26px; box-shadow: 0 0 16px rgba(163,91,255,.7); }
.orbdot { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c9b2ff 30%, #7c4dff 70%, #3d1f9e); box-shadow: 0 0 10px rgba(163,91,255,.6); flex-shrink: 0; }

/* toolbar */
.tools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.trow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; }
.seg button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; color: var(--sub); padding: 7px 13px; border-radius: 9px; cursor: pointer; transition: all .18s var(--ease); white-space: nowrap; }
.seg button:hover { color: var(--text); background: rgba(255,255,255,.04); }
.seg button.on { background: var(--grad); color: #fff; box-shadow: 0 6px 18px -8px rgba(88,101,242,.8); }
.seg button .n { font-size: 11.5px; opacity: .7; background: rgba(255,255,255,.12); padding: 0 6px; border-radius: 8px; }
.seg.icons button { padding: 7px 10px; }
.spacer { flex: 1; }
.search { flex: 1; min-width: 240px; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; transition: border-color .15s; }
.search:focus-within { border-color: rgba(88,101,242,.7); }
.search input { flex: 1; background: none; border: 0; outline: none; color: var(--text); padding: 10px 0; font: inherit; }
.search svg { color: var(--dim); }
.dd { position: relative; }
.ddbtn, .tog, .ibtn { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); color: var(--sub); border-radius: 12px; padding: 9px 13px; cursor: pointer; transition: all .15s var(--ease); white-space: nowrap; }
.ddbtn:hover, .tog:hover, .ibtn:hover { color: var(--text); border-color: var(--line2); }
.ddbtn b { color: var(--text); font-weight: 600; }
.ddbtn .chev { width: 14px; height: 14px; transition: transform .2s; }
.dd.open .ddbtn .chev { transform: rotate(180deg); }
.ddmenu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 230px; background: #171a2d; border: 1px solid var(--line2); border-radius: 12px; padding: 6px; z-index: 20; box-shadow: 0 20px 50px -12px #000; display: none; animation: fade .15s var(--ease); }
.dd.open .ddmenu { display: block; }
.filt { display: flex; flex-direction: column; gap: 4px; padding: 6px 0 10px; border-top: 1px solid var(--line); }
.filt.off { opacity: .45; pointer-events: none; }
.frow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; flex-wrap: wrap; }
.fl { display: flex; flex-direction: column; gap: 2px; } .fl b { font-weight: 500; } .fl small { color: var(--sub); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px 7px 8px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.035); color: var(--sub); cursor: pointer; font: inherit; font-size: 13px; transition: background .18s var(--ease), border-color .18s, color .18s, transform .12s; }
.chip:hover { color: var(--text); border-color: var(--line2); background: rgba(255,255,255,.06); }
.chip:active { transform: scale(.97); }
.chip .box { width: 18px; height: 18px; border-radius: 6px; border: 1.6px solid rgba(255,255,255,.28); display: inline-grid; place-items: center; flex-shrink: 0; transition: all .18s var(--ease); }
.chip.rd .box { border-radius: 50%; }
.chip .box svg.i { width: 12px; height: 12px; stroke-width: 3.2; color: #fff; }
.chip.on { color: #fff; border-color: rgba(150,130,255,.55); background: linear-gradient(135deg, rgba(88,101,242,.22), rgba(163,91,255,.16)); box-shadow: 0 6px 18px -10px rgba(120,100,255,.8); }
.chip.on .box { background: var(--grad); border-color: transparent; box-shadow: 0 0 10px rgba(130,110,255,.6); }
.chip svg.i { width: 16px; height: 16px; }
.chip svg.k-orbs { color: #b9a6ff; } .chip svg.k-cosmetic { color: #ff8fd0; } .chip svg.k-ingame { color: #7cc4ff; } .chip svg.k-code { color: #f0b232; } .chip svg.k-other { color: #9aa0b8; }
.chip .kimg { width: 22px; height: 22px; border-radius: 6px; object-fit: cover; } .chip .orbdot, .chip .orbg { width: 18px; height: 18px; }
.chip .gico { width: 24px; height: 24px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
.chip .gico.none { display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--grad); }
.chips.off, .pks.off { opacity: .45; pointer-events: none; }
.pks { display: inline-flex; padding: 4px; gap: 4px; border-radius: 14px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
.pk { display: inline-flex; align-items: center; gap: 6px; min-width: 40px; justify-content: center; padding: 7px 13px; border-radius: 10px; border: 0; background: transparent; color: var(--sub); font: 600 13px var(--display); cursor: pointer; transition: all .18s var(--ease); }

.pk.on { color: #fff; background: var(--grad) border-box; box-shadow: 0 6px 16px -8px rgba(110,90,255,.9); }
.pk svg.i { width: 16px; height: 16px; }
.every { display: flex; align-items: center; gap: 10px; }

.tag.exp { margin-left: 4px; font: 700 10px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; color: #ffd98a; background: rgba(240,178,50,.12); border: 1px solid rgba(240,178,50,.35); }
.claimbar { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; margin-bottom: 12px; border-radius: 14px; border: 1px solid rgba(62,207,142,.35); background: linear-gradient(135deg, rgba(62,207,142,.14), rgba(24,160,201,.06)); }
.claimbar .grow { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #d2f9e5; }
.claimbar .cg { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #2ed39a, #18a0c9); color: #fff; box-shadow: 0 8px 18px -10px #2ed39a; }

.claimst.s-testing .dot { background: #f0b232; animation: blink 1s infinite; } .claimst.s-nofn, .claimst.s-learn, .claimst.s-oldplugin, .claimst.s-noanswer, .claimst.s-noplugin { border-color: rgba(240,178,50,.4); color: #ffe2a8; } .claimst.s-nofn .dot, .claimst.s-learn .dot, .claimst.s-oldplugin .dot, .claimst.s-noanswer .dot, .claimst.s-noplugin .dot { background: #f0b232; } .claimst.s-none .dot { background: #7cc4ff; }
.claimst.s-captcha, .claimst.s-failed { border-color: rgba(242,91,91,.4); color: #ffc9c9; } .claimst.s-captcha .dot, .claimst.s-failed .dot { background: #f25b5b; box-shadow: 0 0 10px #f25b5b; }
@keyframes blink { 50% { opacity: .3; } }
small.okc { color: #7fe0b2 !important; }
.gamebox { background: rgba(0,0,0,.18); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }

.chips.games { justify-content: flex-start; max-height: 230px; overflow: auto; }

.tog.on { color: var(--text); background: rgba(163,91,255,.16); border-color: rgba(163,91,255,.5); }
.ibtn { padding: 9px 10px; }
.btn { background-origin: border-box; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 9px 16px; cursor: pointer; font: 600 13.5px var(--display); letter-spacing: .01em; color: var(--text);
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 6px 16px -10px rgba(0,0,0,.8);
  transition: transform .15s var(--ease), box-shadow .2s, background .2s, border-color .2s, filter .2s; }
.btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.2); background: linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.04)); }

  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 10px 26px -10px rgba(110,90,255,.95); }

// a sparkline (area chart) of recent values, with min and max chips under it

function sparkSvg(hist, cls) {

}

    [[880, 0], [1175, 0.14], [1568, 0.28]].forEach(([f, d]) => {

let updLost = 0, updTo = '';

async function whatsNew() {
  const u = S.update || {}, seen = localStorage.getItem('orbek.seenVer') || '';

  try { localStorage.setItem('orbek.seenVer', S.version); } catch (e) {}
